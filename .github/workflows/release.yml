name: Build and optionally publish
on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish to PyPI after Trusted Publisher setup
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python scripts/audit_public_tree.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/release_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  publish:
    if: inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
