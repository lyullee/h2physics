search_scope = ["Official NREL/NLR H2FillS and Hydrogen Secure Data Center pages/manuals", "NREL/NLR retail station and FCEV composite data-product index", "California Air Resources Board 2024 Existing Light-Duty Hydrogen Refueling Stations In-Use Study", "H2-Stations API v2 docs and license", "DOE OSTI and Sandia/NREL HyStEP public technical records", "Powertech/H2Protocol source lead cited in published fueling models", "Cal State LA station operational papers/repository records", "NIST Transient Flow Facility pages"]
