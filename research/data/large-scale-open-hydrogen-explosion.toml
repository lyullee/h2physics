state = "readme_workbook_and_one_raw_trace_schema_acquired"
inspection = "The official DataverseNO version 1 record declares CC0-1.0, and its README and 20.7 KB workbook were acquired from the official per-file API. The workbook has a test summary with columns for test number, nozzle diameter [mm], reservoir pressure [bar], ignition-position code and four explosion-pressure sensor summaries [kPa]. The README describes high-pressure measurements, equal sensor spacing along x, ignition-trigger synchronization, calibration relations, and mass-flow measurements for tests 1-27 only."
limitations = "README, summary workbook and Test001 time history are acquired. The selected trace retains absolute timestamp as source text, elapsed sample seconds, four pressure channels in kPa, and PT1/PT2/MFR/camera-trigger voltage. Voltage channels remain uncalibrated because row-specific offset evidence is absent. Sensor spacing/origin, ignition-code coordinates, ambient conditions and several source histories remain unspecified. No explosion or FDS comparison is supported."

