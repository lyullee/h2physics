qualification_contract = ["Individual fill or controlled test identifier and apparatus boundary", "Common clock or documented synchronization for all retained channels", "Pressure and temperature channels with sensor location and units", "Mass flow or dispensed mass with units, measurement plane and calibration", "Sampling cadence, missing-data behavior, uncertainty/calibration, and fill termination", "Versioned file list, exact byte counts and publisher checksums", "Explicit license covering data redistribution and attribution"]
next_action = "Request permission or a licensed, versioned raw export from NREL/HSDS, CARB or the original data custodians (including Powertech/Cal State LA operators). Do not ingest traces derived from published plots, registered model output, aggregate products, or live API status signals as fueling measurements."

