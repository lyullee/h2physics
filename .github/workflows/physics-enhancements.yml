name: Model extensions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
jobs:
  host-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,thermo,chemistry,cycles]'
      - name: Focused host and native-owner connections
        run: >-
          python -m pytest -q
          tests/test_combustion_screening.py tests/test_indoor_release.py
          tests/test_mechanical_rupture.py tests/test_sdof.py
          tests/test_electrocatalyst_metrics.py tests/test_par_device.py
          tests/test_thermal_cycles.py tests/test_redox_equilibrium.py
          tests/test_liquefaction_cycle.py
          tests/test_electrochemistry.py tests/test_core_thermo.py
          tests/test_cantera_multiphase.py tests/test_cantera_caloric.py
          tests/test_cold_package_imports.py
      - run: python scripts/audit_public_tree.py
  indoor-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select native runtime before starting Python
        run: python -m pip install -e '.[test,thermo]' 'hyram==6.1' 'scipy==1.16.3'
      - run: MPLBACKEND=Agg python -m pytest -q tests/test_indoor_release.py
