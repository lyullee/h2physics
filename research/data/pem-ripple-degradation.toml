schema_status = "README confirms 36 unaveraged IV CSV files (four cells; baseline plus eight later characterizations), four continuous timestamp/current/voltage logs, and one reported-fit table. IV current_A and voltage_V are A and V; step_index is an integer sweep index. Continuous current_A and voltage_V are A and V; timestamp is timezone-naive with millisecond tokens. Fitted R_mem is ohm, i_0 and I_lim are A, RMSE is V; alpha remains a reported scalar without an assigned unit."
operating_conditions_reported = "The README reports one 1,000-hour campaign and common 2 A mean current: PEM1 300 Hz ripple, PEM2 pure DC, PEM3 600 Hz ripple, PEM4 1,200 Hz ripple; the three ripple cells use 50% magnitude. It identifies continuous logging as approximately 1 Hz, with gaps during polarization sessions."
model_link_boundary = "Raw cell current cannot be converted to current density without active area. Temperature, pressure, water-feed state, sensor calibration/uncertainty, clock timezone and cross-cell synchronization are not supplied in the reviewed schema. Keep fit rows separate from measurements; no independent HydrogenStack validation, missing-period reconstruction, stack-level state or performance qualification is admitted."

