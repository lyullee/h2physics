[schema_audit]
state = "metadata_only_hdf5_audit_of_Exp03"
inspection = "MATLAB v7.3 structure names and array metadata were read without loading experiment arrays: MFM has 49,999 MFR/time rows, plus pressure and density vectors; its unit cells label MFR g/s, pressure bar, density kg/m^3. Vent has 49,999 time/volume-flow rows and labels volume flow m^3/h. S contains 38 sensor entries with fields including ID, time, concentration, transfer, temperature, humidity, units and position; the sensor metadata labels time sec and concentration %vol."
limitations = "MFM/Tank/Vent recorder clocks are not established as synchronized with the sensor clock; MFM.time has no explicit time-unit cell in this file; sensor position coordinate units/frame and release expansion state are not specified. MAT storage shape does not supply those physical meanings. The separate file-handling guide PDF is listed but not acquired."

